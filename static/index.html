<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --link: var(--tg-theme-link-color, #2f6fed);
    --btn: var(--tg-theme-button-color, #2f6fed);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --header-bg: var(--tg-theme-header-bg-color, var(--bg));

    --amber: #FF9F1C;
    --amber-dim: rgba(255, 159, 28, 0.16);
    --green: #1FAA59;
    --green-dim: rgba(31, 170, 89, 0.12);
    --red: #E5484D;
    --red-dim: rgba(229, 72, 77, 0.12);

    --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 78px;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--header-bg);
    padding: 16px 18px 0 18px;
  }

  .app-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .road-divider {
    margin-top: 14px;
    height: 3px;
    border-radius: 2px;
    background-image: repeating-linear-gradient(
      to right, var(--amber) 0 14px, transparent 14px 24px
    );
    background-size: 48px 3px;
    animation: road-move 1.8s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .road-divider { animation: none; }
  }

  @keyframes road-move {
    from { background-position: 0 0; }
    to { background-position: -48px 0; }
  }

  main {
    padding: 16px 18px 24px 18px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--hint);
  }
  .empty-state .glyph {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .empty-state button {
    margin-top: 16px;
  }

  .summary-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: stretch;
    margin-bottom: 18px;
  }
  .summary-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-col .label {
    font-size: 12px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .summary-col .value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 17px;
  }
  .summary-divider {
    width: 0;
    border-left: 2px dashed var(--amber);
    margin: 2px 16px;
  }
  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }

  .big-total {
    text-align: center;
    padding: 22px 10px 26px 10px;
  }
  .big-total .label {
    font-size: 13px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .big-total .value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 32px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-title {
    font-weight: 700;
    font-size: 15px;
  }
  .card-sub {
    font-size: 12.5px;
    color: var(--hint);
    margin-top: 2px;
  }
  .card-amount {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 13px;
    color: var(--hint);
  }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--amber-dim);
    color: var(--amber);
  }
  .badge.active-badge { background: var(--green-dim); color: var(--green); }

  .section-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 22px 0 10px 2px;
  }

  .month-bar-row { margin-bottom: 14px; }
  .month-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
  }
  .month-bar-label .m { color: var(--hint); font-family: var(--font-mono); }
  .month-bar-track {
    height: 8px;
    background: var(--card);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
  }
  .month-bar-fill.income { background: var(--green); }
  .month-bar-fill.expense { background: var(--red); }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--header-bg);
    border-top: 1px solid var(--amber-dim);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
    z-index: 20;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 1px;
    color: var(--hint);
    font-family: var(--font-body);
    font-size: 9.5px;
    cursor: pointer;
  }
  .nav-btn .icon { font-size: 18px; }
  .nav-btn.active { color: var(--amber); }

  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    z-index: 30;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet h2 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 16px 0;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--hint);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--amber-dim);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--amber);
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-primary, .btn-secondary, .btn-danger {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-secondary { background: var(--card); color: var(--text); }
  .btn-danger { background: var(--red-dim); color: var(--red); }

  .toast {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13.5px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .icon-x {
    position: absolute;
    top: 10px; right: 10px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--red-dim);
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
  }

  .lang-switch {
    display: flex;
    background: var(--card);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 22px;
  }
  .lang-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    color: var(--hint);
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--amber);
    color: #1a1a1a;
  }

  .support-card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
  }
  .support-card .glyph { font-size: 34px; margin-bottom: 8px; }
  .support-card p {
    color: var(--hint);
    font-size: 13.5px;
    line-height: 1.5;
    margin: 8px 0 18px 0;
  }
  .support-btn {
    display: inline-block;
    background: var(--amber);
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 12px;
  }

  .more-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--card);
    font-size: 14px;
  }
  .more-row .hint { color: var(--hint); font-size: 12.5px; }

  .mini-delete {
    border: none;
    background: var(--red-dim);
    color: var(--red);
    width: 24px; height: 24px;
    min-width: 24px;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .amount-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Davlat raqami va mashina qo'shish qadamlari */
  .plate { font-family: var(--font-mono); letter-spacing: 0.04em; }
  .plate-big {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border: 2px solid var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    margin: 2px 0 14px;
  }
  .field input.plate-input {
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .step-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .sheet-text { color: var(--hint); font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
  .badge.muted-badge { background: var(--red-dim); color: var(--red); }
  .badge.watch-badge { background: var(--card); color: var(--link); border: 1px solid var(--link); }
  .btn-small {
    border: none;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--green-dim);
    color: var(--green);
  }
  .btn-small.no { background: var(--red-dim); color: var(--red); }
</style>
</head>

<div class="app-header">
  <div class="app-header-row">
    <h1 id="page-title">Moshinalar</h1>
    <button class="add-btn" id="add-btn">+</button>
  </div>
  <div class="road-divider"></div>
</div>

<main>

  <!-- HISOBOT -->

  <!-- KO'PROQ -->

</main>

<nav class="bottom-nav">

</nav>

<div class="sheet-overlay" id="sheet-overlay">

<div class="toast" id="toast"></div>

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({

  }[c]));
}

// Backend barcha summalarni SO'MDA qaytaradi (har yozuv o'z muzlatilgan kursi bilan aylantirilgan).
// displayCurrency - foydalanuvchi ko'rishni tanlagan valyuta (UZS yoki USD).
// inputCurrency - oxirgi kiritish valyutasi (eslab qolinadi).
// currentRate - joriy USD/UZS kursi (serverdan, cbu.uz).
let displayCurrency = localStorage.getItem("depo_display_currency") || "UZS";
let inputCurrency = localStorage.getItem("depo_input_currency") || "UZS";
let currentRate = 12650; // server javobi kelguncha vaqtinchalik

function setDisplayCurrency(cur) {
  displayCurrency = cur;
  localStorage.setItem("depo_display_currency", cur);
  renderPage(state.page);
}

  });

function currencyToggleHtml() {

    <div class="lang-switch" style="margin-bottom:16px;">
      <button type="button" class="lang-btn cur-btn ${inputCurrency === "UZS" ? "active" : ""}" data-cur="UZS" onclick="setInputCurrency('UZS')">so'm (UZS)</button>
      <button type="button" class="lang-btn cur-btn ${inputCurrency === "USD" ? "active" : ""}" data-cur="USD" onclick="setInputCurrency('USD')">$ (USD)</button>
    </div>`;
}

async function loadRate() {
  try {
    const r = await api("/api/rate");
    if (r && r.usd && r.usd > 1000) currentRate = r.usd;
  } catch (e) { /* kurs kelmasa, oxirgi qiymat ishlatiladi */ }
}

// n - SO'MDAGI qiymat. displayCurrency ga qarab ko'rsatadi.
function formatSum(n) {
  const num = Number(n) || 0;
  if (displayCurrency === "USD") {
    const usd = num / currentRate;
    const sign = usd < 0 ? "-" : "";
    return sign + "$" + Math.abs(usd).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  const sign = num < 0 ? "-" : "";
  const abs = Math.round(Math.abs(num)).toString();
  const withSpaces = abs.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return sign + withSpaces + " " + tr("so'm");
}

// Element o'zining ASL kiritilgan valyutasida ko'rsatiladi
// (masalan "$100" yoki "500 000 so'm" - qanday kiritilgan bo'lsa, shunday)
function formatOriginal(amount, currency) {
  const num = Number(amount) || 0;
  if (currency === "USD") {
    const sign = num < 0 ? "-" : "";
    return sign + "$" + Math.abs(num).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  const sign = num < 0 ? "-" : "";
  const abs = Math.round(Math.abs(num)).toString();
  const withSpaces = abs.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return sign + withSpaces + " " + tr("so'm");
}

// "1 500 000", "1,500,000", "1.500.000" va "12,5" ko'rinishidagi summalarni o'qiydi
function parseAmount(raw) {
  let s = String(raw).replace(/\s/g, "");
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, "");
  else s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, options = {}) {
  const headers = Object.assign(
    { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    options.headers || {}
  );
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (!res.ok) {
    let detail = "Xatolik yuz berdi";
    try {
      const body = await res.json();
      if (typeof body.detail === "string") detail = body.detail;
    } catch (e) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAll() {
  const [trucks, trips, activeTrips, report, sharing] = await Promise.all([
    api("/api/trucks"),
    api("/api/trips"),
    api("/api/trips/active"),
    api("/api/report"),
    api("/api/sharing"),
  ]);
  state.trucks = trucks;
  state.trips = trips;
  state.activeTrips = activeTrips;
  state.report = report;
  state.sharing = sharing;
  loadRate(); // kursni fonda yangilaymiz (kutmasdan)

  // Tanlangan reys endi mavjud bo'lmasa yoki hali tanlanmagan bo'lsa - birinchisini tanlaymiz
  if (!state.activeTrips.find(t => t.id === state.selectedExpenseTripId)) {
    state.selectedExpenseTripId = state.activeTrips.length ? state.activeTrips[0].id : null;
  }
  if (!state.activeTrips.find(t => t.id === state.selectedLegTripId)) {
    state.selectedLegTripId = state.activeTrips.length ? state.activeTrips[0].id : null;
  }
}

function renderPage(page) {
  if (page === "trucks") renderTrucks();
  if (page === "trips") renderTrips();
  if (page === "expenses") renderExpenses();
  if (page === "legs") renderLegs();
  if (page === "report") renderReport();
  if (page === "more") renderMore();
}

// "MAN · 90 kub" (eski, raqamsiz qo'shilgan furalarda - qo'shilgan sana)
function truckSpecs(t) {
  const parts = [];
  if (t.brand) parts.push(escapeHtml(t.brand));
  if (t.volume) parts.push(`${Number(t.volume).toLocaleString("ru-RU")} ${tr("kub")}`);
  if (parts.length) return parts.join(" · ");
  return t.created_at ? `${tr("Qo'shilgan")}: ${escapeHtml(t.created_at)}` : "";
}

function renderTrucks() {
  const el = document.getElementById("page-trucks");
  const sh = state.sharing;
  if (state.trucks.length === 0 && sh.watching.length === 0 && sh.incoming.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🚛</div>
      ${tr("Hali fura qo'shilmagan.")}<br>${tr("Boshlash uchun yuqoridagi + tugmasini bosing.")}
    </div>`;
    return;
  }

  let html = "";
  if (sh.incoming.length) {
    html += `<div class="section-title">${tr("Kuzatish so'rovlari")}</div>`;
    html += sh.incoming.map(r => `
      <div class="card">
        <div class="card-title">👀 ${escapeHtml(r.watcher_name)}</div>
        <div class="card-sub">${tr("mashinangizni kuzatmoqchi")}: <span class="plate">${escapeHtml(r.truck_name)}</span></div>
        <div class="sheet-actions" style="margin-top:12px;">
          <button class="btn-secondary" onclick="decideWatch(${r.id}, false)">${tr("Rad etish")}</button>
          <button class="btn-primary" onclick="decideWatch(${r.id}, true)">${tr("Ruxsat berish")}</button>
        </div>
      </div>
    `).join("");
  }

  html += `<div class="section-title">${tr("Mening mashinalarim")} · ${state.trucks.length}/${sh.max_trucks}</div>`;
  html += state.trucks.length ? state.trucks.map(t => `
    <div class="card" data-truck-id="${t.id}">
      <div class="card-top">
        <div>
          <div class="card-title plate">${escapeHtml(t.name)}</div>
          <div class="card-sub">${truckSpecs(t)}</div>
        </div>
        <span class="badge">${tr("Ta'mirlash")}: ${formatSum(t.repair_total)}</span>
      </div>
    </div>
  `).join("") : `<div class="card-sub" style="margin-bottom:10px;">${tr("Hali fura qo'shilmagan.")}</div>`;

  if (sh.watching.length) {
    const badges = {
      approved: `<span class="badge watch-badge">👁 ${tr("Kuzatilmoqda")}</span>`,
      pending: `<span class="badge">⏳ ${tr("Kutilmoqda")}</span>`,
      rejected: `<span class="badge muted-badge">${tr("Rad etilgan")}</span>`,
    };
    html += `<div class="section-title">${tr("Kuzatilayotgan mashinalar")}</div>`;
    html += sh.watching.map(w => `
      <div class="card" ${w.status === "approved" ? `data-watch-truck-id="${w.truck_id}"` : ""}>
        <div class="card-top">
          <div>
            <div class="card-title plate">${escapeHtml(w.truck_name)}</div>
            <div class="card-sub">${truckSpecs(w)}</div>
          </div>
          <span class="amount-row">
            ${badges[w.status] || ""}
            ${w.status !== "approved" ? `<button class="mini-delete" onclick="cancelWatch(${w.id}, '${w.status}')">✕</button>` : ""}
          </span>
        </div>
      </div>
    `).join("");
  }

  el.innerHTML = html;
  el.querySelectorAll("[data-truck-id]").forEach(card => {
    card.addEventListener("click", () => openTruckDetail(Number(card.dataset.truckId)));
  });
  el.querySelectorAll("[data-watch-truck-id]").forEach(card => {
    card.addEventListener("click", () => openWatchedTruck(Number(card.dataset.watchTruckId)));
  });
}

function openAddTruckSheet() {

      <p class="sheet-text">${tr("Bitta akkauntga 5 tagacha mashina qo'shish mumkin")}. ${tr("Yangi mashina qo'shish uchun avval birortasini o'chiring.")}</p>

function showTruckPlateStep() {
  openSheet(`
    ${stepLabel(1)}
    <h2>${tr("Yangi fura qo'shish")}</h2>
    <div class="field">
      <label>${tr("Davlat raqami")}</label>
      <input type="text" id="nt-plate" class="plate-input" autocomplete="off" autocapitalize="characters"
             placeholder="01 A 123 BC" value="${escapeHtml(state.newTruck.plateRaw)}" ${onEnter("submitTruckPlateStep")}>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="closeSheet()">${tr("Bekor qilish")}</button>
      <button class="btn-primary" onclick="submitTruckPlateStep()">${tr("Keyingi")}</button>
    </div>
  `);
  focusInput("nt-plate");
}

async function submitTruckPlateStep() {
  const raw = document.getElementById("nt-plate").value.trim();
  if (!raw) return showToast(tr("Davlat raqamini kiriting"));
  let res;
  try {
    res = await api(`/api/trucks/check?plate=${encodeURIComponent(raw)}`);
  } catch (e) { return showToast(tr(e.message)); }
  Object.assign(state.newTruck, { plateRaw: raw, plate: res.plate, display: res.display });
  if (res.status === "mine") return showToast(tr("Bu mashina sizda allaqachon bor"));
  if (res.status === "taken") return showPlateTaken(res.request);
  showTruckBrandStep();
}

// Raqam boshqa akkauntda band: kuzatish uchun so'rov yuborishni taklif qilamiz
function showPlateTaken(requestStatus) {
  const nt = state.newTruck;
  let body;
  if (requestStatus === "pending") {
    body = `<p class="sheet-text">⏳ ${tr("So'rovingiz yuborilgan, egasining javobini kuting.")}</p>`;
  } else if (requestStatus === "approved") {
    body = `<p class="sheet-text">👁 ${tr("Siz bu mashinani allaqachon kuzatyapsiz.")}</p>`;
  } else if (requestStatus === "rejected") {
    body = `<p class="sheet-text">${tr("Mashina egasi so'rovingizni rad etgan")}.</p>`;
  }
  const actions = body ? `
    <div class="sheet-actions">
      <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
    </div>` : `
    <p class="sheet-text">${tr("Agar bu mashinani kuzatmoqchi bo'lsangiz, egasiga so'rov yuboring. U ruxsat bersa, mashinaning xarajatlari va reyslarini ko'ra olasiz.")}</p>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="showTruckPlateStep()">${tr("Orqaga")}</button>
      <button class="btn-primary" onclick="sendWatchRequest()">${tr("So'rov yuborish")}</button>
    </div>`;
  openSheet(`
    <h2>🚫 ${tr("Bu raqamli mashina allaqachon qo'shilgan")}</h2>
    <div class="plate-big">${escapeHtml(nt.display)}</div>
    ${body || ""}
    ${actions}
  `);
}

async function sendWatchRequest() {
  if (isSubmitting) return;
  isSubmitting = true;
  try {
    await api("/api/watch", { method: "POST", body: JSON.stringify({ plate: state.newTruck.plate }) });
    closeSheet();
    await loadAll();
    renderTrucks();
    showToast(tr("So'rov yuborildi"));
  } catch (e) {
    showToast(tr(e.message));
  } finally {
    isSubmitting = false;
  }
}

    </div>

function submitTruckBrandStep() {
  const brand = document.getElementById("nt-brand").value.trim();
  if (!brand) return showToast(tr("Markani kiriting"));

let isSubmitting = false;

async function submitAddTruck() {
  if (isSubmitting) return;
  const nt = state.newTruck;
  const volume = parseAmount(document.getElementById("nt-volume").value);
  if (!volume || volume <= 0) return showToast(tr("Hajmni kiriting"));
  isSubmitting = true;
  const btn = document.querySelector("#sheet-content .btn-primary");
  if (btn) { btn.disabled = true; btn.style.opacity = "0.6"; }
  try {
    await api("/api/trucks", {
      method: "POST", body: JSON.stringify({ plate: nt.plate, brand: nt.brand, volume })
    });
    closeSheet();
    state.newTruck = null;
    await loadAll();
    renderTrucks();
    showToast(tr("Fura qo'shildi"));
  } catch (e) {
    if (btn) { btn.disabled = false; btn.style.opacity = "1"; }
    // Shu orada boshqa akkaunt xuddi shu raqamni qo'shib ulgurgan bo'lsa
    if (e.status === 409) showPlateTaken(null);
    else showToast(tr(e.message));
  } finally {
    isSubmitting = false;
  }
}

// ---------------- REYSLAR ----------------
function renderTrips() {
  const el = document.getElementById("page-trips");
  const active = state.trips.filter(t => t.status === "active");
  const finished = state.trips.filter(t => t.status === "finished");

  let html = "";

  if (active.length === 0 && finished.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🧭</div>
      ${tr("Hali reys yo'q.")}<br>${tr("Yangi reys boshlash uchun + tugmasini bosing.")}
    </div>`;
    return;
  }

  if (active.length) {
    html += `<div class="section-title">${tr("Faol reys")}</div>`;
    html += active.map(t => tripCardHtml(t, true)).join("");
  }
  if (finished.length) {
    html += `<div class="section-title">${tr("Tugagan reyslar")}</div>`;
    html += finished.map(t => tripCardHtml(t, false)).join("");
  }
  el.innerHTML = html;

  el.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openTripDetail(Number(card.dataset.tripId)));
  });
}

function tripCardHtml(t, isActive) {
  const profitClass = t.profit >= 0 ? "positive" : "negative";
  return `
    <div class="card" data-trip-id="${t.id}">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(t.truck_name)}</div>
          <div class="card-sub">${escapeHtml(t.created_at)}</div>
        </div>
        <span class="badge ${isActive ? "active-badge" : ""}">${isActive ? tr("Faol") : tr("Tugagan")}</span>
      </div>
      <div class="card-row">
        <span>${tr("Daromad")}: ${formatSum(t.income)}</span>
        <span>${tr("Xarajat")}: ${formatSum(t.expense)}</span>
      </div>
      <div class="card-row">
        <span class="card-amount value ${profitClass}">${tr("Foyda")}: ${formatSum(t.profit)}</span>
      </div>
    </div>
  `;
}

function openAddTripSheet() {
  if (state.trucks.length === 0) {
    return openSheet(`
      <h2>${tr("Avval fura qo'shing")}</h2>
      <p style="color:var(--hint);">${tr("Reys boshlash uchun kamida bitta fura kerak.")}</p>
      <div class="sheet-actions">
        <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
      </div>
    `);
  }
  const activeTruckIds = new Set(state.activeTrips.map(t => t.truck_id));
  const availableTrucks = state.trucks.filter(t => !activeTruckIds.has(t.id));
  if (availableTrucks.length === 0) {
    return openSheet(`
      <h2>${tr("Barcha furalar band")}</h2>
      <p style="color:var(--hint);">${tr("Barcha furalaringizda hozir faol reys bor. Yangisini boshlash uchun avval birortasini yakunlang, yoki yangi fura qo'shing.")}</p>
      <div class="sheet-actions">
        <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
      </div>
    `);
  }
  const options = availableTrucks.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
  openSheet(`
    <h2>${tr("Yangi reys boshlash")}</h2>
    <div class="field">
      <label>${tr("Fura")}</label>
      <select id="trip-truck-id">${options}</select>

      <button class="btn-secondary" onclick="closeSheet()">${tr("Bekor qilish")}</button>

    </div>
  `);
}

// readOnly = boshqa akkauntning mashinasini kuzatish (o'chirish/yakunlash tugmalarisiz)
function tripDetailHtml(trip, readOnly) {
  const tripId = trip.id;
  const delBtn = (fn, id) => readOnly ? "" : `<button class="mini-delete" onclick="${fn}(${tripId}, ${id})">✕</button>`;
  const legsHtml = trip.legs.length ? trip.legs.map(l => `
    <div class="card-row">
      <span>${escapeHtml(l.from_point)} → ${escapeHtml(l.to_point)}</span>
      <span class="amount-row">
        <span>${formatOriginal(l.price, l.currency)}</span>
        ${delBtn("deleteTripLeg", l.id)}
      </span>
    </div>
  `).join("") : `<div class="card-row"><span style="color:var(--hint)">${tr("Safar qo'shilmagan")}</span></div>`;

  const expHtml = trip.expenses.length ? trip.expenses.map(e => `
    <div class="card-row">
      <span>${escapeHtml(tr(e.category))}${e.note ? " · " + escapeHtml(e.note) : ""}</span>
      <span class="amount-row">
        <span>${formatOriginal(e.amount, e.currency)}</span>
        ${delBtn("deleteTripExpense", e.id)}
      </span>
    </div>
  `).join("") : `<div class="card-row"><span style="color:var(--hint)">${tr("Xarajat qo'shilmagan")}</span></div>`;

  const profitClass = trip.profit >= 0 ? "positive" : "negative";
  const actions = readOnly ? `
      <button class="btn-secondary" onclick="openWatchedTruck(${trip.truck_id})">${tr("Orqaga")}</button>
    ` : `
      ${trip.status === "active" ? `<button class="btn-primary" onclick="confirmFinishTrip(${trip.id})">${tr("Reysni yakunlash")}</button>` : ""}
      <button class="btn-danger" onclick="confirmDeleteTrip(${trip.id})">${tr("Reysni o'chirish")}</button>
    `;

  return `
    ${readOnly ? `<span class="badge watch-badge" style="margin-bottom:10px;">👁 ${tr("Faqat ko'rish")}</span>` : ""}
    <h2>${escapeHtml(trip.truck_name)} — ${tr("reys")} #${trip.id}</h2>
    <div class="summary-card" style="margin-bottom:16px;">
      <div class="summary-col">
        <span class="label">${tr("Daromad")}</span>
        <span class="value">${formatSum(trip.income)}</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-col">
        <span class="label">${tr("Xarajat")}</span>
        <span class="value">${formatSum(trip.expense)}</span>
      </div>
    </div>
    <div class="card-amount value ${profitClass}" style="font-size:17px; margin-bottom:16px;">
      ${tr("Sof foyda")}: ${formatSum(trip.profit)}
    </div>
    <div class="section-title">${tr("Safarlar")}</div>
    ${legsHtml}
    <div class="section-title">${tr("Xarajatlar")}</div>
    ${expHtml}
    <div class="sheet-actions" style="margin-top:18px;">
      ${actions}
    </div>
  `;
}

function openAddExpenseSheet() {
  if (state.activeTrips.length === 0) {
    return openSheet(`
      <h2>Faol reys yo'q</h2>
      <p style="color:var(--hint);">Xarajat qo'shish uchun avval reys boshlang.</p>
      <div class="sheet-actions"><button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button></div>
    `);
  }
  openSheet(`
    <h2>${tr("Xarajat qo'shish")}</h2>
    <div class="field">
      <label>${tr("Turi")}</label>
      <select id="exp-category">
        <option value="Yoqilg'i">${tr("Yoqilg'i")}</option>
        <option value="Yo'l haqi">${tr("Yo'l haqi")}</option>
        <option value="Ovqatlanish">${tr("Ovqatlanish")}</option>
        <option value="Boshqa">${tr("Boshqa")}</option>
      </select>
    </div>
    <div class="field">
      <label>${tr("Summasi")}</label>
      ${currencyToggleHtml()}
      <input type="text" inputmode="decimal" id="exp-amount" placeholder="0">
    </div>
    <div class="field">
      <label>${tr("Izoh (ixtiyoriy)")}</label>
      <input type="text" id="exp-note" placeholder="">
    </div>
    <div class="sheet-actions">

      <button class="btn-primary" onclick="submitAddExpense()">${tr("Saqlash")}</button>
    </div>
  `);
}

async function submitAddExpense() {
  if (isSubmitting) return;
  const category = document.getElementById("exp-category").value;
  const amount = parseAmount(document.getElementById("exp-amount").value);
  const note = document.getElementById("exp-note").value.trim();
  if (!amount || amount <= 0) return showToast(tr("Summani kiriting"));
  const tripId = state.selectedExpenseTripId || state.activeTrips[0].id;
  isSubmitting = true;
  const btn = document.querySelector("#sheet-content .btn-primary");
  if (btn) { btn.disabled = true; btn.style.opacity = "0.6"; }
  try {
    await api(`/api/trips/${tripId}/expenses`, {
      method: "POST", body: JSON.stringify({ category, amount, note, currency: inputCurrency })
    });
    closeSheet();
    await loadAll();
    renderExpenses();
    showToast(tr("Xarajat qo'shildi"));
  } catch (e) {
    showToast(tr(e.message));
    if (btn) { btn.disabled = false; btn.style.opacity = "1"; }
  } finally {
    isSubmitting = false;
  }
}

// ---------------- SAFARLAR (faol reys) ----------------
function selectLegTrip(tripId) {
  state.selectedLegTripId = tripId;
  renderLegs();
}

async function renderLegs() {
  const el = document.getElementById("page-legs");
  if (state.activeTrips.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">📍</div>
      ${tr("Faol reys yo'q.")}<br>${tr('Avval "Reyslar" bo\'limida reys boshlang.')}
    </div>`;
    return;
  }
  const tripId = state.selectedLegTripId || state.activeTrips[0].id;
  const trip = await api(`/api/trips/${tripId}`);
  const total = trip.income;
  const listHtml = trip.legs.length ? trip.legs.map(l => `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(l.from_point)} → ${escapeHtml(l.to_point)}</div>
          <div class="card-sub">${escapeHtml(l.created_at)}</div>
        </div>
        <div class="amount-row">
          <div class="card-amount">${formatOriginal(l.price, l.currency)}</div>
          <button class="mini-delete" onclick="deleteLegFromList(${tripId}, ${l.id})">✕</button>
        </div>
      </div>
    </div>
  `).join("") : `<div class="empty-state" style="padding:24px 0;">${tr("Hali safar kiritilmagan")}</div>`;

  el.innerHTML = `
    ${truckSwitcherHtml(state.activeTrips, tripId, "selectLegTrip")}
    <div class="card-sub" style="margin-bottom:10px;">${escapeHtml(trip.truck_name)} — ${tr("joriy reys")}</div>
    <div class="big-total">
      <div class="label">${tr("Jami daromad")}</div>
      <div class="value">${formatSum(total)}</div>
    </div>
    ${listHtml}
  `;
}

async function deleteLegFromList(tripId, legId) {
  if (!confirm(tr("Ushbu safarni o'chirmoqchimisiz?"))) return;
  try {
    await api(`/api/trips/${tripId}/legs/${legId}`, { method: "DELETE" });
    await loadAll();
    renderLegs();
    showToast(tr("Safar o'chirildi"));
  } catch (e) { showToast(tr(e.message)); }
}

function openAddLegSheet() {
  if (state.activeTrips.length === 0) {
    return openSheet(`
      <h2>Faol reys yo'q</h2>
      <p style="color:var(--hint);">Safar qo'shish uchun avval reys boshlang.</p>
      <div class="sheet-actions"><button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button></div>
    `);
  }
  openSheet(`
    <h2>${tr("Safar qo'shish")}</h2>
    <div class="field">
      <label>${tr("Qayerdan")}</label>
      <input type="text" id="leg-from" placeholder="Masalan: Toshkent">
    </div>
    <div class="field">
      <label>${tr("Qayerga")}</label>
      <input type="text" id="leg-to" placeholder="Masalan: Samarqand">
    </div>
    <div class="field">
      <label>${tr("Narxi")}</label>
      ${currencyToggleHtml()}
      <input type="text" inputmode="decimal" id="leg-price" placeholder="0">
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="closeSheet()">${tr("Bekor qilish")}</button>
      <button class="btn-primary" onclick="submitAddLeg()">${tr("Saqlash")}</button>
    </div>
  `);
}

async function submitAddLeg() {
  if (isSubmitting) return;
  const from_point = document.getElementById("leg-from").value.trim();
  const to_point = document.getElementById("leg-to").value.trim();
  const price = parseAmount(document.getElementById("leg-price").value);
  if (!from_point || !to_point) return showToast(tr("Yo'nalishni kiriting"));
  if (!price || price <= 0) return showToast(tr("Narxni kiriting"));
  const tripId = state.selectedLegTripId || state.activeTrips[0].id;
  isSubmitting = true;
  const btn = document.querySelector("#sheet-content .btn-primary");
  if (btn) { btn.disabled = true; btn.style.opacity = "0.6"; }
  try {
    await api(`/api/trips/${tripId}/legs`, {
      method: "POST", body: JSON.stringify({ from_point, to_point, price, currency: inputCurrency })
    });
    closeSheet();
    await loadAll();
    renderLegs();
    showToast(tr("Safar qo'shildi"));
  } catch (e) {
    showToast(tr(e.message));
    if (btn) { btn.disabled = false; btn.style.opacity = "1"; }
  } finally {
    isSubmitting = false;
  }
}

// ---------------- HISOBOT ----------------
function renderReport() {
  const el = document.getElementById("page-report");
  const r = state.report;
  if (!r || (r.total_income === 0 && r.total_expense === 0)) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">📊</div>
      ${tr("Hali statistika uchun ma'lumot yo'q.")}
    </div>`;
    return;
  }
  const profitClass = r.net_profit >= 0 ? "positive" : "negative";

  const maxMonth = Math.max(1, ...r.by_month.map(m => Math.max(m.income, m.expense)));
  const monthsHtml = r.by_month.map(m => `
    <div class="month-bar-row">
      <div class="month-bar-label"><span class="m">${escapeHtml(m.month)}</span><span>${formatSum(m.profit)}</span></div>
      <div class="month-bar-track">
        <div class="month-bar-fill income" style="width:${(m.income / maxMonth * 100).toFixed(1)}%"></div>
      </div>
      <div class="month-bar-track" style="margin-top:3px;">
        <div class="month-bar-fill expense" style="width:${(m.expense / maxMonth * 100).toFixed(1)}%"></div>
      </div>
    </div>
  `).join("");

  const trucksHtml = r.by_truck.map(t => `
    <div class="card">
      <div class="card-top">
        <div class="card-title">${escapeHtml(t.name)}</div>
        <div class="card-amount value ${t.profit >= 0 ? "positive" : "negative"}">${formatSum(t.profit)}</div>
      </div>
      <div class="card-row">
        <span>${tr("Daromad")}: ${formatSum(t.income)}</span>
        <span>${tr("Xarajat")}: ${formatSum(t.expense)}</span>
      </div>
    </div>
  `).join("");

  el.innerHTML = `
    <div class="big-total">
      <div class="label">${tr("Sof foyda / zarar")}</div>
      <div class="value ${profitClass}">${formatSum(r.net_profit)}</div>
    </div>
    <div class="summary-card">
      <div class="summary-col">
        <span class="label">${tr("Jami daromad")}</span>
        <span class="value">${formatSum(r.total_income)}</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-col">
        <span class="label">${tr("Jami xarajat")}</span>
        <span class="value">${formatSum(r.total_expense)}</span>
      </div>
    </div>
    <div class="section-title">${tr("Oylar kesimida")}</div>
    ${monthsHtml || `<div class="card-sub">${tr("Ma'lumot yo'q")}</div>`}
    <div class="section-title">${tr("Moshinalar kesimida")}</div>
    ${trucksHtml || `<div class="card-sub">${tr("Ma'lumot yo'q")}</div>`}
  `;
}

function shareBot() {
  const botUrl = "https://t.me/depohisobkitobbot";
  const shareText = tr("DEPO HisobKitob — fura reyslari, xarajat va foydani avtomatik hisoblaydigan bepul bot. Sinab ko'ring:");
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`;
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
    window.Telegram.WebApp.openTelegramLink(shareUrl);
  } else {
    window.open(shareUrl, "_blank");
  }
}

function copySupportCard() {
  const number = SUPPORT_CARD_NUMBER.replace(/\s/g, "");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(number)
      .then(() => showToast(tr("Nusxalandi")))
      .catch(() => showToast(number));
  } else {
    showToast(number);
  }
}
